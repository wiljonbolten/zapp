# Command scheduler
[program:laravel-scheduler]
command=sh -c "while [ true ]; do (php /var/www/app/zapp schedule:run --no-interaction &); sleep 60; done"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=true
autorestart=true
startretries=0
